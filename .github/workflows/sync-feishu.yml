name: Sync Feishu Bitable

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Feishu to Supabase
        run: npm run feishu:sync
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_TABLE_PRODUCTS: ${{ secrets.FEISHU_TABLE_PRODUCTS }}
          FEISHU_TABLE_COST_COMPONENTS: ${{ secrets.FEISHU_TABLE_COST_COMPONENTS }}
          FEISHU_TABLE_PRE_LAUNCH: ${{ secrets.FEISHU_TABLE_PRE_LAUNCH }}
          FEISHU_TABLE_SUPPLIERS: ${{ secrets.FEISHU_TABLE_SUPPLIERS }}
          FEISHU_TABLE_COMPETITORS: ${{ secrets.FEISHU_TABLE_COMPETITORS }}
          FEISHU_TABLE_OPERATION_LOGS: ${{ secrets.FEISHU_TABLE_OPERATION_LOGS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
